<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="Речной катер — аркада про катер на озере Неро. Уворачивайся от препятствий, спасай людей, пройди маршрут мимо ростовских монастырей и кремля.">
<meta name="theme-color" content="#0b1a2a">
<meta property="og:title" content="Речной катер">

<style>
  html,body{margin:0;height:100%;background:#0b1a2a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
    font-family:"Courier New",monospace;font-weight:bold;color:#fff}
  #wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  canvas{display:block;width:100%;height:100%}
  .ui{position:absolute;left:0;right:0;pointer-events:none;text-shadow:2px 2px 0 #000}
  #hud{top:6px;display:flex;justify-content:space-between;padding:0 8px;font-size:16px}
  #hud span{white-space:nowrap;display:inline-block}
  .pop{animation:pop .35s}
  @keyframes pop{30%{transform:scale(1.45)}}
  #zones{top:0;bottom:0;opacity:0;transition:opacity .6s}
  #zones.show{opacity:1}
  #zones div{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;font-size:.9em;letter-spacing:.25em;color:rgba(255,255,255,.9);border-top:1px dashed rgba(255,255,255,.55)}
  .zg{top:55%;height:25%;background:rgba(255,176,64,.16)}
  .zb{top:80%;height:20%;background:rgba(88,184,255,.2)}
  #snd{position:absolute;right:6px;top:2.3em;font-size:1.25em;cursor:pointer;text-shadow:1px 1px 0 #000;padding:.2em;line-height:1;user-select:none}
  .cta{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);max-width:92%}
  .cta p{margin:0 0 10px;font-size:15px;line-height:1.4;color:#fff}
  .cta a{display:inline-block;pointer-events:auto;cursor:pointer;background:#ffd84a;color:#14304a;text-decoration:none;text-shadow:none;font-weight:bold;font-size:16px;white-space:nowrap;padding:11px 18px;border-radius:10px;box-shadow:0 3px 0 #b8891a}
  .cta a:active{transform:translateY(2px);box-shadow:0 1px 0 #b8891a}
  #pauseBtn{position:absolute;right:6px;top:4.6em;font-size:1.25em;cursor:pointer;text-shadow:1px 1px 0 #000;padding:.2em;line-height:1;user-select:none}
  #gauge{top:2.6em;left:8px;width:9em;height:.7em;background:rgba(0,0,0,.45);border:1px solid #000;border-radius:.4em;overflow:hidden}
  #gFill{display:block;height:100%;width:0;background:#fff}
  #gTxt{top:2.45em;left:12.6em;font-size:.8em;white-space:nowrap}
  #banner{top:22%;text-align:center;font-size:2.4em;letter-spacing:.15em;color:#ffe9a0;opacity:0;transition:opacity .6s}
  #msg{top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;
    background:rgba(5,15,30,.55);font-size:15px;line-height:1.5}
  #msg h1{font-size:30px;margin:0 0 10px;color:#ffd84a}
  #msg .big{font-size:20px;color:#ffd84a;margin-top:14px;animation:bl 1s steps(2) infinite}
  @keyframes bl{50%{opacity:.25}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="360" height="640"></canvas>
  <div id="hud" class="ui"><span id="hScore">0 м</span><span id="hPass"></span><span id="hHp"></span></div>
  <div id="banner" class="ui"></div>
  <div id="gauge" class="ui"><i id="gFill"></i></div><div id="gTxt" class="ui"></div>
  <div id="zones" class="ui"><div class="zg">ГАЗ</div><div class="zb">ТОРМОЗ</div></div>
  <div id="snd" title="Звук (M)">🔊</div>
  <div id="pauseBtn" title="Пауза (P)">⏸</div>
  <div id="msg" class="ui"></div>
</div>
<script>
(() => {
const W = 180, H = 320, BOAT_Y = 272; // BOAT_Y — центр катера по вертикали
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

const wrap = document.getElementById('wrap');
const CTA_URL = 'https://vk.ru/progulca76';
const CTA_TEXT = 'Понравилось? Приходите покататься по озеру Неро на настоящем катере';
const CTA_BTN = 'Записаться на прогулку';
const loaded = { atlas: false, river: false }; // что уже загрузилось
const assetsReady = () => loaded.atlas && loaded.river;
let paused = false, newBest = false;
const hScore = document.getElementById('hScore'), hPass = document.getElementById('hPass'),
      hHp = document.getElementById('hHp'), msg = document.getElementById('msg'),
      zones = document.getElementById('zones'), pauseBtn = document.getElementById('pauseBtn'), sndBtn = document.getElementById('snd'), gFill = document.getElementById('gFill'), gTxt = document.getElementById('gTxt'),
      banner = document.getElementById('banner');

let KS = 2; // пикселей холста на один логический пиксель игры (180x320)
function setupCanvas(s) { // рисуем в реальном разрешении экрана — без растягивания и «мыла»
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.min(1080, Math.max(360, Math.round(W * s * dpr)));
  KS = cw / W;
  cv.width = cw; cv.height = Math.round(H * KS);
  ctx.setTransform(KS, 0, 0, KS, 0, 0);
  ctx.imageSmoothingEnabled = false; ctx.imageSmoothingQuality = 'high';
}
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  wrap.style.width = W * s + 'px'; wrap.style.height = H * s + 'px';
  wrap.style.fontSize = Math.max(10, s * 5.5) + 'px';
  setupCanvas(s);
}
addEventListener('resize', resize); resize();

// ---------- save ----------
let best = 0;
try { best = +localStorage.getItem('boatBest') || 0; } catch (e) {}

// ---------- audio ----------
let ac = null, muted = false, eng = null;
try { muted = localStorage.getItem('boatMuted') === '1'; } catch (e) {}
function beep(f, d, type = 'square', v = 0.05, slide = 0) {
  if (muted) return;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.linearRampToValueAtTime(f + slide, ac.currentTime + d);
    g.gain.value = v; g.gain.linearRampToValueAtTime(0, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}

// двигатель и шум воды: высота тона и громкость следуют за скоростью, газ добавляет оборотов
function audioInit() { // вызывается из жеста пользователя (старт игры)
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    if (eng) return;
    const master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    const o1 = ac.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 60;
    const o2 = ac.createOscillator(); o2.type = 'square'; o2.frequency.value = 30;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const eg = ac.createGain(); eg.gain.value = 0.5;
    o1.connect(lp); o2.connect(lp); lp.connect(eg); eg.connect(master);
    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const ns = ac.createBufferSource(); ns.buffer = buf; ns.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.6;
    const ng = ac.createGain(); ng.gain.value = 0;
    ns.connect(bp); bp.connect(ng); ng.connect(master);
    o1.start(); o2.start(); ns.start();
    eng = { master, o1, o2, lp, bp, ng };
  } catch (e) {}
}
function audioUpdate() {
  if (!eng) return;
  const on = state === 'play' && !muted, now = ac.currentTime;
  eng.master.gain.setTargetAtTime(on ? 0.16 : 0, now, 0.15);
  if (!on) return;
  const g = Math.max(0, thr), f = 48 + speed * 16 + g * 12;
  eng.o1.frequency.setTargetAtTime(f, now, 0.08); eng.o2.frequency.setTargetAtTime(f / 2, now, 0.08);
  eng.lp.frequency.setTargetAtTime(260 + speed * 120 + g * 160, now, 0.1);
  eng.ng.gain.setTargetAtTime(Math.min(1, speed / 4) * 0.55, now, 0.2);
  eng.bp.frequency.setTargetAtTime(500 + speed * 250, now, 0.2);
}
function noiseBurst(dur, freq, vol) { // всплеск воды
  if (!ac || muted) return;
  try {
    const n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    const g = ac.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
  } catch (e) {}
}
sndBtn.textContent = muted ? '🔇' : '🔊';
sndBtn.addEventListener('pointerdown', e => { e.stopPropagation(); toggleMute(); });
function toggleMute() {
  muted = !muted; sndBtn.textContent = muted ? '🔇' : '🔊';
  try { localStorage.setItem('boatMuted', muted ? '1' : '0'); } catch (e) {}
}

// ---------- input ----------
const keys = {}; const touches = new Map();
const coarse = matchMedia('(pointer: coarse)').matches; let zonesTimer = 0;
function showZones(on, ms) { // подсказка зон газа/тормоза — только на телефоне и ненадолго
  clearTimeout(zonesTimer); zones.classList.toggle('show', on && coarse);
  if (on && ms) zonesTimer = setTimeout(() => zones.classList.remove('show'), ms);
}
function popEl(el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyM') toggleMute();
  if (e.code === 'KeyP' || e.code === 'Escape') setPause(!paused);
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' || e.code === 'Enter') tapStart();
});
addEventListener('keyup', e => keys[e.code] = false);
function ptrDir(e) { const r = wrap.getBoundingClientRect(); return (e.clientX - r.left) < r.width / 2 ? -1 : 1; }
function ptrThr(e) { // низ экрана — тормоз, чуть выше — газ, выше — обычный ход
  const r = wrap.getBoundingClientRect(), fy = (e.clientY - r.top) / r.height;
  return fy > 0.8 ? -1 : fy > 0.55 ? 1 : 0;
}
wrap.addEventListener('pointerdown', e => { touches.set(e.pointerId, { d: ptrDir(e), thr: ptrThr(e) }); tapStart(); });
wrap.addEventListener('pointermove', e => { const q = touches.get(e.pointerId); if (q) { q.d = ptrDir(e); q.thr = ptrThr(e); } });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => wrap.addEventListener(t, e => touches.delete(e.pointerId)));
function inputDir() {
  let d = 0;
  if (keys.ArrowLeft || keys.KeyA) d -= 1;
  if (keys.ArrowRight || keys.KeyD) d += 1;
  for (const v of touches.values()) d += v.d;
  return Math.max(-1, Math.min(1, d));
}
function inputThr() {
  let g = 0;
  if (keys.ArrowUp || keys.KeyW) g += 1;
  if (keys.ArrowDown || keys.KeyS) g -= 1;
  for (const v of touches.values()) g += v.thr;
  return Math.max(-1, Math.min(1, g));
}

// ---------- sprites ----------
function mk(rows, pal) {
  const c = document.createElement('canvas'); c.width = rows[0].length; c.height = rows.length;
  const x = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, i) => { if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, y, 1, 1); } }));
  return c;
}
function shadowOf(spr) { // тёмный силуэт для тени на воде
  const c = document.createElement('canvas'); c.width = spr.width; c.height = spr.height;
  const x = c.getContext('2d'); x.drawImage(spr, 0, 0);
  x.globalCompositeOperation = 'source-in'; x.fillStyle = 'rgba(0,10,40,.32)'; x.fillRect(0, 0, c.width, c.height);
  return c;
}
const ringSpr = mk([
  '..rrr..',
  '.rwwwr.',
  'rw...wr',
  'rw...wr',
  'rw...wr',
  '.rwwwr.',
  '..rrr..'
], { r: '#e83030', w: '#fafafa' });
const SH = { ring: shadowOf(ringSpr) };

// ---------- атлас: катеры, люди, буи, камни, деревья (из присланных моделей) ----------
const ATLAS = {"boat0":[0,0,112,284],"boat1":[114,0,112,284],"boat2":[228,0,112,284],"boat3":[342,0,112,284],"boat4":[456,0,112,284],"boat5":[570,0,112,284],"boat6":[684,0,112,284],"boat7":[798,0,112,284],"streak0":[912,0,46,224],"ring2":[960,0,68,220],"streak1":[1030,0,45,183],"streak2":[1077,0,46,180],"tree0":[1125,0,131,135],"tree2":[1258,0,75,102],"tree1":[1335,0,89,100],"buoy2":[1426,0,41,95],"rockB4":[1469,0,111,94],"bush10":[1582,0,83,92],"reed0":[1667,0,55,80],"rockB0":[1724,0,102,79],"bush1":[1828,0,71,74],"lily0":[1901,0,79,72],"bush3":[0,286,72,69],"reed1":[74,286,46,68],"snag3":[122,286,88,68],"ps5":[212,286,35,67],"ps1":[249,286,35,65],"ps6":[286,286,37,65],"ps0":[325,286,36,64],"ps2":[363,286,34,64],"ps7":[399,286,35,64],"ps9":[436,286,35,64],"buoy0":[473,286,33,64],"bush8":[508,286,77,64],"ps8":[587,286,34,63],"ps11":[623,286,33,63],"ps10":[658,286,34,62],"buoy4":[694,286,38,62],"ps3":[734,286,36,61],"ps4":[772,286,32,61],"bush0":[806,286,74,61],"bush9":[882,286,65,61],"ps12":[949,286,36,60],"ps14":[987,286,35,60],"ps15":[1024,286,35,60],"buoy1":[1061,286,34,60],"buoy3":[1097,286,41,60],"bush5":[1140,286,81,60],"ps13":[1223,286,33,59],"rockB1":[1258,286,65,59],"pw6":[1325,286,75,58],"ps16":[1402,286,32,58],"ps17":[1436,286,32,58],"wave0":[1470,286,127,58],"wave3":[1599,286,130,58],"pw4":[1731,286,79,57],"pw7":[1812,286,71,57],"wave2":[1885,286,114,57],"pw0":[0,357,79,56],"wave1":[81,357,119,56],"pw5":[202,357,74,55],"pw2":[278,357,68,54],"pw3":[348,357,73,54],"buoy5":[423,357,35,54],"rockB2":[460,357,82,54],"wring":[544,357,100,54],"ring0":[646,357,63,52],"ring1":[711,357,64,52],"pw1":[777,357,64,51],"bush2":[843,357,55,51],"snag2":[900,357,81,51],"rockG0":[983,357,56,49],"log1":[1041,357,83,48],"bush4":[1126,357,48,46],"rockG1":[1176,357,63,46],"log0":[1241,357,79,46],"snag1":[1322,357,64,46],"rockB3":[1388,357,66,42],"snag0":[1456,357,60,42],"bush7":[1518,357,48,40],"grass2":[1568,357,48,37],"bush6":[1618,357,36,33],"rockS0":[1656,357,40,31],"rockS2":[1698,357,43,31],"grass0":[1743,357,32,31],"grass1":[1777,357,39,31],"grass3":[1818,357,37,31],"grass4":[1857,357,31,31],"rockS1":[1890,357,40,29],"bush11":[1932,357,27,27]};
const ASSET_V = 13; // меняйте при обновлении картинок, чтобы браузер не брал старые из кэша
const SZ = 0.125; // логических пикселей на пиксель атласа (атлас в полном разрешении)
const BOAT_W = 14, BOAT_H = 35.5, MAXP = 7;
const atlasImg = new Image(); let atlasReady = false; const shCache = {};
atlasImg.onload = () => { atlasReady = true; loaded.atlas = true; if (state === 'title') setMsg(); };
atlasImg.onerror = () => { console.error('Не загрузился атлас спрайтов'); };
atlasImg.src = 'atlas.png?v=' + ASSET_V;
const sprSize = (n, k = 1) => [ATLAS[n][2] * SZ * k, ATLAS[n][3] * SZ * k];
function drawSpr(n, x, y, k = 1, alpha = 1, anchorY = 0.5) { // x — центр; anchorY: 0 — верх спрайта в точке y, 1 — низ
  if (!atlasReady) return;
  const r = ATLAS[n], w = r[2] * SZ * k, h = r[3] * SZ * k;
  ctx.imageSmoothingEnabled = true;
  if (alpha !== 1) ctx.globalAlpha = alpha;
  ctx.drawImage(atlasImg, r[0], r[1], r[2], r[3], x - w / 2, y - h * anchorY, w, h);
  if (alpha !== 1) ctx.globalAlpha = 1;
  ctx.imageSmoothingEnabled = false;
}
function shadowSpr(n) { // силуэт-тень, создаётся один раз
  if (!shCache[n]) {
    const r = ATLAS[n], c = document.createElement('canvas'); c.width = r[2]; c.height = r[3];
    const x = c.getContext('2d'); x.drawImage(atlasImg, r[0], r[1], r[2], r[3], 0, 0, r[2], r[3]);
    x.globalCompositeOperation = 'source-in'; x.fillStyle = 'rgba(0,10,40,.3)'; x.fillRect(0, 0, r[2], r[3]);
    shCache[n] = c;
  }
  return shCache[n];
}
function drawShadow(n, x, y, k = 1, anchorY = 0.5, dx = 1, dy = 2) {
  if (!atlasReady) return;
  const r = ATLAS[n], w = r[2] * SZ * k, h = r[3] * SZ * k;
  ctx.imageSmoothingEnabled = true; ctx.drawImage(shadowSpr(n), x - w / 2 + dx, y - h * anchorY + dy, w, h); ctx.imageSmoothingEnabled = false;
}

// ---------- helpers ----------
function hash(n) { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); }
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = t => t * t * (3 - 2 * t);
const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const mkpal = o => { const r = {}; for (const k in o) r[k] = (typeof o[k] === 'string' && k !== 'name') ? hex(o[k]) : o[k]; return r; };
const PAL = [
  mkpal({ name: 'УТРО', deep: '#4a95c0', water: '#62b6dc', light: '#a8e0f0', foam: '#f0fbff', grass: '#86c070', grassL: '#aadc7c', dark: '#549a50', trunk: '#6a4a2c', sand: '#eadca8', sandD: '#c9b57e', ov: [255, 196, 170, .16], n: [0] }),
  mkpal({ name: 'ДЕНЬ', deep: '#2a7cc6', water: '#3f9fe2', light: '#78c6f0', foam: '#ffffff', grass: '#7fbf4a', grassL: '#a2d65e', dark: '#4f9a3a', trunk: '#5a3a20', sand: '#f2e3a6', sandD: '#cfb878', ov: [0, 0, 0, 0], n: [0] }),
  mkpal({ name: 'ЗАКАТ', deep: '#3c2a70', water: '#6a3f94', light: '#f0905a', foam: '#ffd2a0', grass: '#5f7e44', grassL: '#86a050', dark: '#2f4030', trunk: '#3a2418', sand: '#dca470', sandD: '#b07850', ov: [255, 110, 50, .14], n: [0] }),
  mkpal({ name: 'НОЧЬ', deep: '#0c1a3a', water: '#14285a', light: '#4a6ab0', foam: '#b8c8f0', grass: '#1e3a34', grassL: '#2c5444', dark: '#10241f', trunk: '#1a1410', sand: '#5a6a7a', sandD: '#3a4858', ov: [10, 20, 70, .36], n: [1] }),
];
const PHASE_M = 400; // метров на фазу
const css = (a, al) => al === undefined ? `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})` : `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
function palette(m) {
  const p = (m / PHASE_M) % PAL.length, i = Math.floor(p), t = smooth(clamp((p - i - 0.55) / 0.45, 0, 1));
  const A = PAL[i], B = PAL[(i + 1) % PAL.length], o = { phase: i };
  for (const k in A) if (k !== 'name') o[k] = A[k].map((v, j) => lerp(v, B[k][j], t));
  o.night = o.n[0];
  return o;
}

// ---------- river ----------

const score = () => Math.floor(dist / 8) + bonus;
const mass = () => 1 + 0.11 * pass;
const boatAngle = () => boat.yaw * 0.85; // корпус плавно поворачивается в сторону руля
const bowPos = () => { const a = boatAngle(); return [boat.x + Math.sin(a) * 17, BOAT_Y - Math.cos(a) * 17]; };
const bobOff = () => Math.round((boat.bob + Math.sin(t * 0.1) * 0.5) * 2) / 2;
const deckSpot = () => [boat.x, BOAT_Y + 1 + bobOff()]; // куда запрыгивает спасённый

function reset() {
  dist = 0; boat = { x: center(H - BOAT_Y), vx: 0, yaw: 0, yawV: 0, bob: 0, bobV: 0 };
  objs = []; wake = []; parts = []; rings = []; flies = []; texts = [];
  spawnT = 40; speed = 1.3; spdMul = 1; steer = 0; lastWakeD = 0;
  thr = 0; pm = 1; pitch = 0; pitchV = 0; zoom = 0; leaves = []; glints = []; fish = []; birds = []; fishT = 200; birdT = 260;
  clouds = [{ x: 40, y: 60, r: 70 }, { x: 130, y: 190, r: 85 }, { x: 90, y: 300, r: 60 }];
  hp = 3; pass = 0; boarded = 0; inv = 0; shake = 0; flash = 0; saved = 0; bonus = 0; lastPhase = -1;
}
reset(); pal = palette(0);

function startGame() { state = 'play'; reset(); audioInit(); setMsg(); showZones(true, 5000); beep(440, .1); }
function tapStart() {
  if (paused) { setPause(false); return; }
  if (!assetsReady()) return;                      // пока картинки не пришли, стартовать нельзя
  if (state === 'title') startGame();
  else if (state === 'over' && over > 40) startGame();
}
function setPause(on) {
  if (on && state !== 'play') return;
  paused = on;
  if (on) {
    msg.style.display = 'flex'; msg.innerHTML = '<h1>ПАУЗА</h1><div class="big">ТАП — ПРОДОЛЖИТЬ</div>';
    if (eng) eng.master.gain.setTargetAtTime(0, ac.currentTime, 0.05);   // двигатель замолкает
  } else setMsg();
  pauseBtn.textContent = on ? '▶' : '⏸';
}
msg.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('a')) e.stopPropagation(); }); // тап по кнопке-ссылке не перезапускает игру
pauseBtn.addEventListener('pointerdown', e => { e.stopPropagation(); setPause(!paused); });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); }); // свернули приложение — пауза

function setMsg() {
  showZones(state === 'title');
  if (state === 'title') {
    msg.style.display = 'flex';
    msg.innerHTML = '<h1>РЕЧНОЙ<br>КАТЕР</h1>Уворачивайся от буёв, брёвен,<br>коряг и мелей.<br>Подбирай людей — но чем больше<br>пассажиров, тем тяжелее руль.<br>Круг спасения чинит корпус.<br><br>← → или тап по половине экрана<br>↑ газ · ↓ тормоз<br>Телефон: касание ниже середины — газ,<br>самый низ экрана — тормоз<div class="big">' + (assetsReady() ? 'ТАП — СТАРТ' : 'ЗАГРУЗКА…') + '</div>' +
      (best ? '<br>Рекорд: ' + best + ' м' : '');
  } else if (state === 'over') {
    msg.style.display = 'flex';
    msg.innerHTML = '<h1>КОНЕЦ РЕЙСА</h1>' + (newBest ? '<div style="color:#ffd84a;font-size:18px;margin-bottom:6px">★ НОВЫЙ РЕКОРД! ★</div>' : '') +
      'Очки: ' + score() + '<br>Спасено людей: ' + saved + '<br>Рекорд: ' + best +
      '<div class="cta"><p>' + CTA_TEXT + '</p><a href="' + CTA_URL + '" target="_blank" rel="noopener noreferrer">' + CTA_BTN + '</a></div>' +
      '<div class="big">ТАП — ЕЩЁ РАЗ</div>';
  } else msg.style.display = 'none';
}
setMsg();

function showBanner(txt) { banner.textContent = txt; banner.style.opacity = 1; bannerT = 120; }

// ---------- spawning ----------
function spawn() {
  const d = dist + H + 10, c = center(d), hw = halfW(d) - 8;
  const r = Math.random();
  if (halfW(d) < 27) { // узкий проход: препятствия не ставим, только изредка человека
    if (r < 0.3 && pass < MAXP) objs.push({ type: 'person', d, x: c + (Math.random() * 2 - 1) * hw * 0.8, ph: Math.random() * 6, vx: 0, tilt: 0, v: Math.floor(Math.random() * 8) });
    return;
  }
  const place = (type, x) => {
    const o = { type, d, x, ph: Math.random() * 6, vx: 0, tilt: 0, hit: false };
    if (type === 'buoy') o.v = Math.floor(Math.random() * 6);
    if (type === 'log' || type === 'snag') {
      o.n = type === 'log' ? 'log' + Math.floor(Math.random() * 2) : 'snag' + Math.floor(Math.random() * 4);
      o.k = type === 'log' ? 1.7 : 1.6; const r = ATLAS[o.n];
      o.hw = r[2] * SZ * o.k * 0.42; o.hh = Math.max(3.5, r[3] * SZ * o.k * 0.3);
    }
    if (type === 'rock') { o.v = Math.floor(Math.random() * 5); const r = ATLAS['rockB' + o.v]; o.hw = r[2] * SZ * 1.35 * 0.36; o.hh = r[3] * SZ * 1.35 * 0.32; }
    objs.push(o); return o;
  };
  const rx = () => c + (Math.random() * 2 - 1) * hw;
  const kinds = ['buoy', 'buoy', 'log', 'log', 'snag', 'rock'];
  const n = Math.random() < Math.min(0.6, 0.15 + dist / 12000) ? 2 : 1;
  const x1 = rx(); place(kinds[Math.floor(Math.random() * kinds.length)], x1);
  if (n === 2) {
    let x2 = x1 + (x1 > c ? -1 : 1) * (38 + Math.random() * 14);
    x2 = clamp(x2, c - hw, c + hw);
    if (Math.abs(x2 - x1) > 30) place(kinds[Math.floor(Math.random() * kinds.length)], x2);
  }
  if (r < 0.40 && pass < MAXP) { // человек, часто рядом с препятствием — риск
    const side = Math.random() < 0.5 ? -1 : 1;
    const px = clamp(x1 + side * (16 + Math.random() * 6), c - hw, c + hw);
    objs.push({ type: 'person', d: d + (Math.random() * 20 - 10), x: px, ph: Math.random() * 6, vx: 0, tilt: 0, v: Math.floor(Math.random() * 8) });
  } else if (r > 0.93 && hp < 3) {
    objs.push({ type: 'ring', d: d + 25, x: rx(), ph: 0, vx: 0, tilt: 0 });
  }
}

// ---------- эффекты ----------
function splash(x, y, n, pw = 1, c = 'foam') {
  for (let i = 0; i < n; i++)
    parts.push({ x, y, vx: (Math.random() * 2 - 1) * 1.1 * pw, vy: -(0.8 + Math.random() * 1.8) * pw, g: 0.16, l: 22 + Math.random() * 12, m: 34, c, s: Math.random() < .3 ? 2 : 1, sc: 1 });
  rings.push({ x, d: dist + H - y, r: 1, a: 1 });
  if (n >= 5) noiseBurst(0.18, 900 + Math.random() * 400, 0.04 * pw);
}
function sparkle(x, y, n) {
  for (let i = 0; i < n; i++) {
    const an = Math.random() * 6.283, sp = 0.4 + Math.random() * 0.9;
    parts.push({ x, y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp - 0.4, g: 0.03, l: 24, m: 24, c: 'gold', s: 1, sc: 0 });
  }
}

function hurt() {
  if (inv > 0) return;
  hp--; inv = 100; shake = 6; flash = 8; popEl(hHp);
  if (pass > 0) eject();
  beep(120, .3, 'sawtooth', .08, -80);
  if (hp <= 0) endGame();
}
function eject() { // пассажира выбрасывает за борт
  const i = pass - 1; pass--; boarded = Math.min(boarded, pass);
  const dir = Math.random() < .5 ? -1 : 1;
  flies.push({ k: 'out', v: Math.floor(Math.random() * 18), x: boat.x + dir * 3, y: BOAT_Y + 1, vx: dir * (0.9 + Math.random() * .6), vy: -2.3, age: 0 });
}
function bump(o, y) { // столкновение: импульс катеру и «пинок» препятствию
  const dir = Math.sign(boat.x - o.x) || (Math.random() < .5 ? -1 : 1);
  const shoal = o.type === 'rock'; // камень: не сдвигается, сильно тормозит
  boat.vx += dir * (shoal ? 0.7 : 1.5) / mass();
  boat.yawV += dir * 0.05; boat.bobV += 1.2;
  spdMul = shoal ? 0.45 : 0.7;
  o.hit = true;
  if (!shoal) { o.vx = -dir * 1.6; o.tilt = -dir * 5; }
  splash(o.x, y, 10, 1.2, 'foam');
  if (pm < 0.65) { inv = Math.max(inv, 25); beep(180, .1, 'triangle', .05); } // тихий ход — мягкое касание без урона
  else hurt();
}
function endGame() {
  state = 'over'; over = 0;
  const s = score();
  newBest = s > best;
  if (newBest) { best = s; try { localStorage.setItem('boatBest', best); } catch (e) {} }
  setMsg();
}

function stepFx(dt) {
  parts.forEach(p => { p.x += p.vx * dt; p.y += (p.vy + (p.sc ? speed * .5 : 0)) * dt; p.vy += p.g * dt; p.l -= dt; });
  parts = parts.filter(p => p.l > 0);
  rings.forEach(r => { r.r += 0.22 * dt; r.a -= 0.02 * dt; }); rings = rings.filter(r => r.a > 0);
  texts.forEach(x => { x.y -= 0.35 * dt; x.l -= dt; }); texts = texts.filter(x => x.l > 0);
  wake.forEach(w => w.a += dt); wake = wake.filter(w => w.a < 55);
  for (let i = flies.length - 1; i >= 0; i--) {
    const f = flies[i];
    if (f.k === 'in') {
      if (f.idx >= pass) { flies.splice(i, 1); continue; }
      f.p += dt / 20;
      const e = smooth(Math.min(1, f.p)), tg = deckSpot();
      f.x = lerp(f.sx, tg[0], e); f.y = lerp(f.sy, tg[1], e) - Math.sin(Math.PI * Math.min(1, f.p)) * 16;
      if (f.p >= 1) { boarded = Math.min(pass, boarded + 1); boat.bobV += 0.8; sparkle(tg[0], tg[1], 6); flies.splice(i, 1); }
    } else {
      f.age += dt; f.vy += 0.2 * dt; f.x += f.vx * dt; f.y += (f.vy + speed * .6) * dt;
      if (f.age > 14 && f.vy > 0) { splash(f.x, f.y, 8, 1, 'foam'); flies.splice(i, 1); }
    }
  }
  // пружины корпуса: рыскание и качка
  const target = clamp(boat.vx * 0.17, -0.55, 0.55);
  boat.yawV += ((target - boat.yaw) * 0.14 - boat.yawV * 0.28) * dt; boat.yaw += boat.yawV * dt;
  boat.bobV += (-boat.bob * 0.14 - boat.bobV * 0.22) * dt; boat.bob += boat.bobV * dt;
  shake *= Math.pow(0.9, dt); flash = Math.max(0, flash - dt);
}

// ---------- живой мир и эффекты скорости ----------
function stepWorld(dt) {
  const play = state === 'play';
  // качка корпуса от газа/тормоза и «наезд камеры» на разгоне
  pitchV += (((play ? thr : 0) - pitch) * 0.12 - pitchV * 0.25) * dt; pitch += pitchV * dt;
  zoom += ((play ? clamp((pm - 1) * 0.045, 0, 0.03) : 0) - zoom) * (1 - Math.pow(0.9, dt));
  // плывущие листья и лепестки
  if (Math.random() < 0.05 * dt * Math.max(0.3, speed)) {
    const d = dist + H + 12, c = center(d), hw = halfW(d);
    leaves.push({ d, x: c + (Math.random() * 2 - 1) * hw * 0.85, c: ['#8fc24a', '#e8c040', '#e87fa0', '#d0703a'][Math.floor(Math.random() * 4)], ph: Math.random() * 6, a: Math.random() * 6 });
  }
  leaves.forEach(l => { l.x += Math.sin(t * 0.03 + l.ph) * 0.06 * dt; });
  leaves = leaves.filter(l => H - (l.d - dist) < H + 10);
  // блики солнца на воде (днём и на закате)
  if (pal.night < 0.7 && Math.random() < 0.3 * dt) {
    const d = dist + Math.random() * H, c = center(d), hw = halfW(d);
    glints.push({ d, x: c + (Math.random() * 2 - 1) * hw * 0.8, l: 28, m: 28 });
  }
  glints.forEach(g => g.l -= dt); glints = glints.filter(g => g.l > 0 && H - (g.d - dist) < H + 4);
  // прыгающие рыбы
  fishT -= dt;
  if (fishT <= 0) {
    fishT = 280 + Math.random() * 400;
    const d = dist + 40 + Math.random() * (H - 100), c = center(d), hw = halfW(d);
    fish.push({ d, x: c + (Math.random() * 2 - 1) * hw * 0.6, p: 0, dir: Math.random() < 0.5 ? -1 : 1, s: 0 });
  }
  for (let i = fish.length - 1; i >= 0; i--) {
    const f = fish[i], y = H - (f.d - dist);
    if (!f.s) { f.s = 1; splash(f.x, y, 4, .5); }
    f.p += dt / 28;
    if (f.p >= 1) { splash(f.x + 8 * f.dir, y, 6, .7); fish.splice(i, 1); }
  }
  // стая птиц: тень и сама птица пролетают над рекой
  birdT -= dt;
  if (birdT <= 0) {
    birdT = 360 + Math.random() * 600;
    const dir = Math.random() < 0.5 ? 1 : -1, y0 = 30 + Math.random() * 200, n = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) birds.push({ x: dir > 0 ? -14 - i * 9 : W + 14 + i * 9, y: y0 + i * 7 + Math.random() * 6, vx: dir * (0.9 + Math.random() * 0.3), vy: 0.15 + Math.random() * 0.2, ph: Math.random() * 6 });
  }
  birds.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; });
  birds = birds.filter(b => b.x > -30 && b.x < W + 30 && b.y < H + 20);
  // тени облаков плывут медленнее воды — получается глубина
  clouds.forEach(c => { c.y += speed * 0.3 * dt; c.x += 0.1 * dt; if (c.y > H + c.r) { c.y = -c.r; c.x = Math.random() * W; } if (c.x > W + c.r) c.x = -c.r; });
  // утопающие подмигивают золотыми искрами — заметнее на фоне реки
  objs.forEach(o => { if (o.type === 'person' && Math.random() < 0.02 * dt) sparkle(o.x + (Math.random() * 8 - 4), H - (o.d - dist) - 3, 1); });
  if (!play) return;
  // линии скорости на разгоне и носовые брызги при торможении
  const g = Math.max(0, pm - 1.12);
  if (Math.random() < g * 1.4 * dt) parts.push({ x: Math.random() * W, y: -14, vx: 0, vy: speed * 2.4, g: 0, l: 70, m: 36, c: 'foam', s: 1, h: 14 + Math.random() * 22, sc: 0, a: 0.5 });
  const br = Math.max(0, -thr) * Math.min(1, speed / 2);
  if (Math.random() < br * 0.9 * dt) {
    const [bx, by] = bowPos(), sd = Math.random() < 0.5 ? -1 : 1;
    parts.push({ x: bx + sd * 3, y: by, vx: sd * (0.5 + Math.random() * 0.6), vy: -0.6 - Math.random() * 0.8, g: 0.05, l: 14, m: 14, c: 'foam', s: Math.random() < 0.4 ? 2 : 1, sc: 0 });
  }
}

// ---------- update ----------
function update(dt) {
  t += dt;
  const m = dist / 8;
  pal = palette(m);
  if (bannerT > 0 && (bannerT -= dt) <= 0) banner.style.opacity = 0;
  stepFx(dt);
  stepWorld(dt);
  audioUpdate();
  if (state !== 'play') {
    if (state === 'title') dist += 0.9 * dt;
    else { over += dt; speed *= Math.pow(0.97, dt); dist += speed * dt; }
    return;
  }
  if (pal.phase !== lastPhase) { lastPhase = pal.phase; showBanner(PAL[pal.phase].name); }

  // скорость сплавления: плавно догоняет цель, мели и удары тормозят
  // газ и тормоз: педаль нажимается плавно, двигатель отзывается с инерцией
  thr += (inputThr() - thr) * (1 - Math.pow(0.85, dt));
  const pmT = thr > 0 ? 1 + 0.55 * thr : 1 + 0.65 * thr; // газ до ×1.55, тормоз до ×0.35
  pm += (pmT - pm) * (1 - Math.pow(thr < 0 ? 0.9 : thr > 0 ? 0.94 : 0.97, dt));
  const base = 1.3 + Math.min(2.4, m / 700);
  spdMul += (1 - spdMul) * (1 - Math.pow(0.97, dt));
  speed += (Math.min(6, base * spdMul * pm) - speed) * (1 - Math.pow(0.9, dt));
  dist += speed * dt;

  // руль: ввод нарастает плавно, тяга делится на массу, пассажиры добавляют инерции
  const M = mass();
  steer += (inputDir() - steer) * (1 - Math.pow(0.80, dt));
  boat.vx += steer * 0.15 * (0.75 + 0.25 * pm) / M * dt; // на малом ходу руль слабее
  const d0 = dist + H - BOAT_Y, c = center(d0), hwB = halfW(d0) - 5;
  const slope = (center(d0 + 3) - center(d0 - 3)) / 6; // наклон русла по картинке
  const cur = -slope * speed * 0.3; // течение сносит катер вдоль изгиба реки
  const off = Math.abs(boat.x - c), sh = clamp((off - (hwB - 12)) / 12, 0, 1); // мелководье у берега
  boat.vx = cur + (boat.vx - cur) * Math.pow(0.90 + 0.006 * pass - 0.04 * sh, dt);
  boat.x += boat.vx * dt;
  if (sh > 0) { spdMul = Math.min(spdMul, 1 - 0.2 * sh); if (sh > .6 && Math.random() < .2 * dt) splash(boat.x + Math.sign(boat.x - c) * 4, BOAT_Y + 6, 1, .4, 'sand'); }
  for (const s of [-1, 1]) {
    if ((boat.x - c) * s > hwB) { // берег: упругий отскок; урон только за сильный удар
      const imp = Math.abs(boat.vx);
      boat.x = c + s * hwB; boat.vx = -s * (imp * 0.55 + 0.35);
      boat.yawV -= s * 0.04; boat.bobV += .6; spdMul = Math.min(spdMul, .75);
      splash(boat.x + s * 4, BOAT_Y, 5, .8, 'sand');
      if (imp * (0.5 + 0.5 * pm) > 1.0) hurt(); else beep(90, .08, 'triangle', .04);
    }
  }

  spawnT -= speed * dt;
  if (spawnT <= 0) { spawn(); spawnT = Math.max(34, 78 - m / 40) + Math.random() * 25; }

  for (let i = objs.length - 1; i >= 0; i--) {
    const o = objs[i], y = H - (o.d - dist);
    if (y > H + 20) { objs.splice(i, 1); continue; }
    if (o.vx) { o.x += o.vx * dt; o.vx *= Math.pow(0.93, dt); if (Math.abs(o.vx) < .02) o.vx = 0; }
    o.tilt *= Math.pow(0.94, dt);
    const dx = Math.abs(o.x - boat.x), dy = Math.abs(y - BOAT_Y);
    if (o.type === 'person' || o.type === 'ring') {
      if (dx < 18 && dy < 24) o.x += (boat.x - o.x) * 0.08 * dt; // лёгкое «притяжение» — приятнее подбирать
      if (dx < 10 && dy < 18) {
        if (o.type === 'person') {
          if (pass >= MAXP) continue;
          pass++; saved++; bonus += 50; popEl(hPass);
          flies.push({ k: 'in', idx: pass - 1, sx: o.x, sy: y, x: o.x, y, p: 0, v: o.v * 2 + Math.floor(Math.random() * 2) });
          texts.push({ x: o.x, y: y - 8, s: '+50', l: 55, m: 55 });
          splash(o.x, y + 2, 5, .6);
          beep(660, .08, 'square', .05); setTimeout(() => beep(880, .1), 70);
        } else {
          hp = Math.min(3, hp + 1); sparkle(o.x, y, 12); texts.push({ x: o.x, y: y - 8, s: '♥', l: 55, m: 55 });
          boat.bobV += .6; beep(520, .15, 'triangle', .07, 300);
        }
        objs.splice(i, 1);
      }
    } else if (!o.hit) {
      const hx = o.hw ?? 4;
      const hy = o.hh ?? 7;
      if (dx < hx + 3 && dy < hy + 12) bump(o, y);
    }
  }
  if (inv > 0) inv = Math.max(0, inv - dt);

  // след: точки привязаны к миру и сносятся вместе с водой — S-образная дорожка при манёврах
  if (dist - lastWakeD >= 1.2) { lastWakeD = dist; wake.push({ x: bowPos()[0], d: dist + H - (BOAT_Y - 14), a: 0, w: 0.6 + 0.07 * pass + 0.6 * Math.max(0, pm - 1) }); }
  if (Math.random() < (0.55 + 0.9 * Math.max(0, pm - 1) + 0.3 * Math.max(0, thr)) * dt) parts.push({ x: boat.x + (Math.random() * 4 - 2) + -Math.sin(boatAngle()) * 17, y: BOAT_Y + 17, vx: 0, vy: 0.2, g: 0, l: 14, m: 14, c: 'foam', s: pm > 1.2 ? 2 : 1, sc: 1 });
  if (Math.random() < 0.15 * dt * speed) { const s = Math.random() < .5 ? -1 : 1; parts.push({ x: bowPos()[0] + s * 4, y: BOAT_Y - 14, vx: s * .5, vy: -.4, g: .08, l: 10, m: 10, c: 'foam', s: 1, sc: 1 }); }
}

// ---------- draw ----------
function px(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), w, h); }

// ---------- река: лента-маршрут ----------
const routeImg = new Image(); let riverReady = false;
routeImg.onload = () => { riverReady = true; loaded.river = true; if (state === 'title') setMsg(); };
routeImg.onerror = () => console.error('Не загрузилась картинка маршрута');
routeImg.src = 'route.jpg?v=' + ASSET_V;

function drawRiver() {
  if (!riverReady) { ctx.fillStyle = css(pal.water); ctx.fillRect(0, 0, W, H); return; }
  const KR = routeImg.width / W, LTd = routeImg.height;              // пикселей картинки на логический пиксель
  const topU = (dist + H) * KR, sy = LTd - (((topU % LTd) + LTd) % LTd), h1 = Math.min(H * KR, LTd - sy);
  ctx.imageSmoothingEnabled = true;
  if (h1 > 0) ctx.drawImage(routeImg, 0, sy, routeImg.width, h1, 0, 0, W, h1 / KR);
  if (h1 < H * KR) ctx.drawImage(routeImg, 0, 0, routeImg.width, H * KR - h1, 0, h1 / KR, W, H - h1 / KR); // перелом круга
  ctx.imageSmoothingEnabled = false;
  // живые белые штрихи течения поверх картинки
  const lanes = [-0.8, -0.4, 0, 0.4, 0.8], f0 = Math.floor(dist / 40) - 1;
  ctx.lineWidth = 0.8; ctx.lineCap = 'round';
  lanes.forEach((f, li) => {
    for (let k = f0; k < f0 + H / 40 + 3; k++) {
      const hs = k * 7.7 + li * 3.1;
      if (hash(hs) > 0.5) continue;
      const d0 = k * 40 + hash(hs + 1) * 30, len = 4 + hash(hs + 2) * 8;
      ctx.beginPath();
      for (let q = 0; q <= len; q += 4) {
        const d = d0 + q, y = H - (d - dist);
        const x = center(d) + f * halfW(d) * 0.8 + Math.sin(d * 0.09 + li) * 1.5 + Math.sin(t * 0.03 + k) * 0.5;
        q ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.strokeStyle = css(pal.foam, 0.25 + hash(hs + 3) * 0.3); ctx.stroke();
    }
  });
}

function drawRing(x, y, rad, a) { drawSpr(rad > 6 ? 'ring0' : 'ring2', x, y, 0.3 + rad * 0.13, clamp(a * 0.9, 0, 1)); } // круги на воде из ассетов
function idleRing(o, x, y) { const q = (t * 0.02 + o.ph) % 1; drawRing(x, y + 3, 2 + q * 6, (1 - q) * 0.55); }

function drawObj(o) {
  const y = H - (o.d - dist) + Math.sin(t * 0.06 + o.ph) * 0.8, x = o.x;
  switch (o.type) {
    case 'buoy': {
      const n = 'buoy' + o.v, yb = y + 3, bh = sprSize(n, 1.5)[1];
      idleRing(o, x, y + 1);
      drawShadow(n, x, yb, 1.5, 1, 1.5, 0.5);
      drawSpr(n, x, yb + Math.sin(t * 0.09 + o.ph) * 0.5, 1.5, 1, 1);
      if (pal.night > .3 && (t >> 4 & 1)) px(x - 1, yb - bh - 1, 3, 3, 'rgba(255,224,102,.45)');
      break;
    }
    case 'snag': case 'log': {
      idleRing(o, x, y + 1);
      ctx.save(); ctx.translate(x, y); ctx.rotate(o.tilt * 0.1 + Math.sin(t * 0.05 + o.ph) * 0.05);
      drawShadow(o.n, 1, 1.5, o.k, .5, 0, 0); drawSpr(o.n, 0, 0, o.k);
      ctx.restore();
      px(x - o.hw, y + o.hh + 1, o.hw * 2, 1, css(pal.foam, .5));
      break;
    }
    case 'rock': drawSpr('rockB' + o.v, x, y, 1.35); break;
    case 'person': drawSpr('pw' + o.v, x, y + Math.sin(t * 0.1 + o.ph) * 0.6, 1.6); break;
    case 'ring':
      idleRing(o, x, y);
      ctx.drawImage(SH.ring, Math.round(x - 2), Math.round(y - 2));
      ctx.drawImage(ringSpr, Math.round(x - 3), Math.round(y - 4));
      if (Math.floor(t / 8) % 6 === 0) px(x + 2, y - 4, 1, 1, '#fff'); break;
  }
}

function drawWake() { // клиновидный след: расходится и тает
  ctx.fillStyle = css(pal.foam);
  const k0 = Math.min(1, speed / 2);
  wake.forEach((w, i) => {
    const y = H - (w.d - dist), k = 1 - w.a / 55;
    if (k <= 0) return;
    const sp = 3 + w.a * 0.11 * (1 + w.w);
    ctx.globalAlpha = k * 0.75 * k0;
    ctx.fillRect(Math.round(w.x - sp), Math.round(y), 1, 2);
    ctx.fillRect(Math.round(w.x + sp), Math.round(y), 1, 2);
    if (w.a < 24 && i % 3 === 0) { ctx.globalAlpha = k * 0.35; ctx.fillRect(Math.round(w.x + Math.sin(w.d * 0.7) * sp * 0.5), Math.round(y), 1, 1); }
  });
  ctx.globalAlpha = 1;
  if (atlasReady && state === 'play') { // широкая струя из ассетов от кормы
    const a = boatAngle();
    ctx.save(); ctx.translate(boat.x - Math.sin(a) * 15, BOAT_Y + Math.cos(a) * 15 + bobOff()); ctx.rotate(a);
    drawSpr('streak1', 0, 0, 1.5 * (0.7 + 0.3 * pm), 0.5 * k0 * (0.6 + 0.4 * pm), 0);
    ctx.restore();
  }
}

function drawBoat() {
  if (!atlasReady || (inv > 0 && (t >> 2 & 1) && state === 'play')) return;
  const n = 'boat' + Math.min(7, boarded), a = boatAngle(), cy = BOAT_Y + bobOff();
  ctx.save(); ctx.translate(boat.x + 1 + pitch * 0.8, cy + 2 + pitch * 1.2); ctx.rotate(a);
  ctx.imageSmoothingEnabled = true; ctx.drawImage(shadowSpr(n), -BOAT_W / 2, -BOAT_H / 2, BOAT_W, BOAT_H); ctx.imageSmoothingEnabled = false;
  ctx.restore();
  ctx.save(); ctx.translate(boat.x, cy); ctx.rotate(a); ctx.scale(1 + Math.abs(pitch) * 0.015, 1 + pitch * 0.05); drawSpr(n, 0, 0, 1); ctx.restore(); // газ — нос приподнимается, тормоз — приседает
  const [bx, by] = bowPos();
  px(bx - 1, by - 1, 3, 1, css(pal.foam, .8)); // пена у носа
  if (pal.night > 0.15 && (t & 7) > 0) px(bx, by + 1, 1, 1, '#ffe066'); // фара
}

const GL = { '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001', '5': '111100111001111', '6': '111100111101111', '7': '111001001001001', '8': '111101111101111', '9': '111101111001111', '+': '000010111010000', '♥': '0101011111111100111000100' };
function drawText(s, x, y, col) {
  let cx = Math.round(x - (s === '♥' ? 2 : s.length * 2));
  for (const ch of s) {
    const g = GL[ch], w = ch === '♥' ? 5 : 3;
    for (const [ox, oy, c] of [[1, 1, '#000'], [0, 0, col]]) {
      ctx.fillStyle = c;
      for (let i = 0; i < g.length; i++) if (g[i] === '1') ctx.fillRect(cx + (i % w) + ox, Math.round(y) + Math.floor(i / w) + oy, 1, 1);
    }
    cx += w + 1;
  }
}

function drawClouds() {
  const k = 0.1 * (1 - pal.night * 0.8);
  clouds.forEach(c => {
    const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
    g.addColorStop(0, `rgba(10,30,50,${k})`); g.addColorStop(1, 'rgba(10,30,50,0)');
    ctx.fillStyle = g; ctx.fillRect(c.x - c.r, c.y - c.r, c.r * 2, c.r * 2);
  });
}
function drawLiving() { // листья, блики, рыбы
  leaves.forEach(l => { ctx.fillStyle = l.c; ctx.save(); ctx.translate(l.x, H - (l.d - dist)); ctx.rotate(l.a + t * 0.02); ctx.fillRect(-1, -0.5, 2, 1); ctx.restore(); });
  glints.forEach(g => {
    const y = Math.round(H - (g.d - dist)), x = Math.round(g.x);
    ctx.globalAlpha = Math.sin(Math.PI * g.l / g.m) * 0.9 * (1 - pal.night); ctx.fillStyle = '#fff';
    ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3);
  });
  ctx.globalAlpha = 1;
  fish.forEach(f => {
    const y = H - (f.d - dist) - Math.sin(Math.PI * f.p) * 8;
    ctx.save(); ctx.translate(f.x + (f.p - 0.5) * 8 * f.dir, y); ctx.rotate((f.p - 0.5) * 1.6 * f.dir);
    ctx.fillStyle = '#e9f4f8'; ctx.fillRect(-2, -0.5, 4, 1.5); ctx.fillStyle = '#4a6a80'; ctx.fillRect(-2, -0.5, 3, 0.7);
    ctx.fillStyle = '#e9f4f8'; ctx.fillRect(2, -1, 1, 2.5); ctx.restore();
  });
}
function drawBirds() {
  ctx.lineCap = 'round'; ctx.lineWidth = 1.1;
  birds.forEach(b => {
    const w = Math.sin(t * 0.45 + b.ph) * 2.6;
    for (const [dx, dy, a] of [[9, 11, 0.12], [0, 0, 0.6]]) {
      ctx.globalAlpha = a; ctx.strokeStyle = a > 0.3 ? '#202830' : '#000';
      ctx.beginPath(); ctx.moveTo(b.x + dx - 4, b.y + dy + 1 - w); ctx.lineTo(b.x + dx, b.y + dy); ctx.lineTo(b.x + dx + 4, b.y + dy + 1 - w); ctx.stroke();
    }
  });
  ctx.globalAlpha = 1;
}

function drawFx() {
  drawLiving();
  rings.forEach(r => drawRing(r.x, H - (r.d - dist), r.r, r.a * 0.8));
  const C = { foam: css(pal.foam), sand: css(pal.sand), gold: '#ffe066' };
  parts.forEach(p => { ctx.globalAlpha = clamp(p.l / p.m * 1.5, 0, 1) * (p.a ?? 1); ctx.fillStyle = C[p.c]; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.h || p.s); });
  ctx.globalAlpha = 1;
  flies.forEach(f => {
    drawSpr('ps' + f.v, f.x, f.y, 1.4);
  });
  texts.forEach(x => { ctx.globalAlpha = clamp(x.l / 20, 0, 1); drawText(x.s, x.x, x.y, x.s === '♥' ? '#ff4a6a' : '#ffe066'); });
  ctx.globalAlpha = 1;
}

function render() {
  ctx.save();
  if (shake > 0.2) ctx.translate(Math.round((Math.random() * 2 - 1) * shake * 0.5), Math.round((Math.random() * 2 - 1) * shake * 0.5));
  if (zoom > 0.0005) { ctx.translate(W / 2, BOAT_Y); ctx.scale(1 + zoom, 1 + zoom); ctx.translate(-W / 2, -BOAT_Y); } // на разгоне картинка слегка «наезжает»
  drawRiver();
  drawClouds();
  drawWake();
  objs.slice().sort((a, b) => a.d - b.d).forEach(drawObj);
  drawBoat();
  drawFx();
  drawBirds();
  ctx.restore();
  const o = pal.ov;
  if (o[3] > 0.005) { ctx.fillStyle = css(o, o[3]); ctx.fillRect(0, 0, W, H); }
  // фара ночью: конус света вперёд
  if (pal.night > 0.05) {
    const [hx, hy] = bowPos(), a = boatAngle(), dx = Math.sin(a), dy = -Math.cos(a), nx = Math.cos(a), ny = Math.sin(a);
    const fx = hx + dx * 110, fy = hy + dy * 110;
    const g = ctx.createLinearGradient(hx, hy, fx, fy);
    g.addColorStop(0, `rgba(255,240,170,${0.34 * pal.night})`); g.addColorStop(1, 'rgba(255,240,170,0)');
    ctx.fillStyle = g; ctx.beginPath();
    ctx.moveTo(hx - nx, hy - ny); ctx.lineTo(hx + nx, hy + ny);
    ctx.lineTo(fx + nx * 30, fy + ny * 30); ctx.lineTo(fx - nx * 30, fy - ny * 30); ctx.fill();
  }
  if (pal.phase === 2) { // закатная дымка сверху
    const g = ctx.createLinearGradient(0, 0, 0, 90); g.addColorStop(0, 'rgba(255,140,60,.18)'); g.addColorStop(1, 'rgba(255,140,60,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 90);
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,60,60,${flash / 20})`; ctx.fillRect(0, 0, W, H); }

  const gv = clamp((pm - 0.35) / 1.2, 0, 1);
  gFill.style.width = (gv * 100) + '%'; gFill.style.background = pm > 1.08 ? '#ffb040' : pm < 0.92 ? '#58b8ff' : '#fff';
  gTxt.textContent = Math.round(speed * 6) + ' уз';
  hScore.textContent = score() + ' м';
  hPass.textContent = '👤' + (pass + 1);
  hHp.textContent = '❤'.repeat(Math.max(0, hp)) + '♡'.repeat(Math.max(0, 3 - hp));
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 16.667, 0, 2.5); last = now; // физика в реальном времени: одинаково гладко на 60 и 144 Гц
  if (!paused) update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
